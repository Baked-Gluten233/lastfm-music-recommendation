name: Optional native Windows verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed base and CPU model dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install --only-binary=:all: -r requirements-phase2.txt
      - name: Run actual Windows and native Jupyter checks
        run: python scripts/verify_windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification-results
          path: outputs/windows_native_verification
